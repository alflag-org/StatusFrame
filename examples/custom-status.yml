site:
  name: Custom Status
  timezone: UTC

features:
  monitoring:
    enabled: false
  incidents:
    enabled: false
  maintenance:
    enabled: false
  notifications:
    enabled: false
  metrics:
    enabled: false
  admin_api:
    enabled: false
  storage:
    enabled: false

status_states:
  - id: online
    label: Online
    severity: 0
  - id: unstable
    label: Unstable
    severity: 1
  - id: offline
    label: Offline
    severity: 2
  - id: preparing
    label: Preparing
    severity: 0
  - id: unknown
    label: Unknown
    severity: 1

components:
  - id: web
    name: Web services
    status: online
  - id: game
    name: Game services
    status: preparing
