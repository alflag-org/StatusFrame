site:
  name: Example Status
  timezone: Asia/Tokyo
components:
  - id: web
    name: Web
  - id: game
    name: Game Services
monitors:
  - id: website-check
    component: web
    type: http
    url: https://example.com/health
    method: GET
    interval: 5m
    timeout: 5s
    failure_threshold: 3
    recovery_threshold: 2
    follow_redirects: false
    expect:
      status: 200
      body_contains: ok
  - id: game-connectivity
    component: game
    type: tcp
    host: play.example.com
    port: 25565
    interval: 1m
  - id: name-resolution
    component: web
    type: dns
    name: example.com
    record_type: A
    interval: 15m
    expect:
      values: [192.0.2.10]
  - id: certificate-check
    component: web
    type: tls
    host: example.com
    port: 443
    interval: 1h
