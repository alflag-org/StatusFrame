site:
  name: Customer Service Status
  description: Current availability of our public services.
  timezone: UTC
components:
  - id: web
    name: Web
    description: Website and account access.
monitors:
  - id: private-health-check
    component: web
    type: http
    url: https://health.example.com/ready
    interval: 5m
    timeout: 5s
    expect:
      status: 200
