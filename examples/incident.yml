site:
  name: Example Status
  timezone: Asia/Tokyo
components:
  - id: web
    name: Web
monitors:
  - id: website-check
    component: web
    type: http
    url: https://example.com/
    interval: 5m
incidents:
  - id: web-disruption
    title: Web service disruption
    status: identified
    impact: partial_outage
    components: [web]
    started_at: '2026-01-01T00:00:00Z'
    updates:
      - status: investigating
        body: We are investigating intermittent service failures.
        created_at: '2026-01-01T00:00:00Z'
      - status: identified
        body: We have identified the cause and are restoring service.
        created_at: '2026-01-01T00:10:00Z'
maintenance:
  - id: service-upgrade
    title: Scheduled service upgrade
    status: scheduled
    components: [web]
    starts_at: '2026-12-01T00:00:00Z'
    ends_at: '2026-12-01T01:00:00Z'
    body: Web services may be briefly unavailable during the upgrade.
notifications:
  webhook: true
