site:
  name: Example Status
  language: ja
  timezone: UTC
components:
  - id: web
    name: Web
monitors:
  - id: website-check
    component: web
    type: http
    url: https://example.com/
    interval: 5m
    timeout: 5s
    failure_threshold: 3
    recovery_threshold: 2
    expect:
      status: 200
